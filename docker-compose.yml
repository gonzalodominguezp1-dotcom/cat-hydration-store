# Local / staging stack. Uses test keys and the simulated supplier only.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes: [dbdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://shop:shop@db:5432/shop
    ports: ["3000:3000"]
    depends_on: [db]
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://shop:shop@db:5432/shop
    command: ["pnpm", "worker"]
    depends_on: [db, web]
volumes:
  dbdata:
